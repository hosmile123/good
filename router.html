<!-- v253-cachebust: 探测改抓 5KB 的 router.html（旧版抓 2.2MB 根路径=打开前先下载两份完整应用，是"打开非常慢"主因）+ 记住最快镜像走快速通道 + 跳转延迟 450ms→80ms -->
<title>工作台 · 智能入口</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#f5f7fa;color:#1f2d3d}
  .card{width:min(92vw,420px);background:#fff;border-radius:16px;padding:28px 24px;
        box-shadow:0 2px 12px rgba(0,0,0,.06);text-align:center}
  .spin{width:34px;height:34px;margin:0 auto 16px;border:4px solid #d3d1c7;
        border-top-color:#378add;border-radius:50%;
        animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .t{font-size:16px;font-weight:500;margin-bottom:6px}
  .s{font-size:13px;color:#5f5e5a;line-height:1.6}
  .links{margin-top:18px;display:none;flex-direction:column;gap:10px}
  .links.show{display:flex}
  .links a{display:block;text-decoration:none;padding:11px 14px;border-radius:10px;
           background:#e6f1fb;color:#0c447c;font-size:14px;border:1px solid #b5d4f4}
  .links a small{display:block;color:#185fa5;font-size:12px;margin-top:2px}
</style>
















<style id="cg-design">
/* ==========================================================================
   晨光玻璃 · 外观层（CG Skin） v3
   --------------------------------------------------------------------------
   只改 5 件事：①背景 ②卡片 ③按钮 ④分级色 ⑤主色
   不改：任何模块结构、布局尺寸、功能逻辑、DOM、脚本
   依赖老版本自带 CSS 变量体系（:root 覆盖即可全局生效，CSS 内 var(--primary) 共 79 处）

   ── 风险规避（已逐条核查老版源码） ─────────────────────────────
   · .lv1/.lv2/.lv3 是「热力图格子」(.heat-day.lv3)，禁止覆盖
   · .eng-lib-item .cli-meta .badge 是英语库语义色（灰/橙/红），不整体覆盖 .badge
   · .subtab 原为透明（容器 .subtabs 是灰底药丸），只透明化、不改白块
   · .li-icon 背景由内联样式分类型着色（客户紫 / 保函蓝 / 佣金橙），禁止覆盖
   · .filter-row 自身无背景，白条来自外层容器，禁止再加背景（会双层）
   ── 设计依据 ─────────────────────────────────────────────────
   参考图（桌面 UI风格 19 张）：极浅蓝紫渐变底 + 近白玻璃卡 + 柔和纯色胶囊
   ========================================================================== */

/* ---------- ① 主色 / 分级色：变量层统一 ---------- */
:root{
  --primary:        #4F8AF8;
  --primary-light:  #EAF2FF;
  --primary-dark:   #3F7EF5;
  --success:        #2FBF8F;
  --warning:        #F6A04D;
  --danger:         #F26D6D;
  --text-primary:   #22314A;
  --text-secondary: #4A5A72;
  --text-light:     #8D99AD;
  --bg-main:        transparent;
  --bg-card:        rgba(255,255,255,.46);
  --border:         rgba(168,192,222,.42);
  --shadow:         0 10px 26px rgba(64,86,122,.12);
  --radius:         14px;
  --radius-lg:      20px;
}

/* ---------- ① 背景：晨光四段渐变 + 四处光斑（浅蓝紫为主，粉/薄荷点缀） ---------- */
html{ background:#e9eff8; }
body{
  background:
    radial-gradient(1000px 560px at 4% -6%,   rgba(255,255,255,.85), transparent 60%),
    radial-gradient(880px 600px at 100% 6%,   rgba(203,221,255,.62), transparent 64%),
    radial-gradient(900px 640px at 6% 102%,   rgba(196,238,228,.55), transparent 62%),
    radial-gradient(720px 480px at 90% 98%,   rgba(255,213,232,.45), transparent 64%),
    linear-gradient(165deg,#e8f1ff 0%,#e9e9fd 28%,#f7edf8 52%,#e6f5f2 78%,#e3f3f8 100%);
  background-attachment: fixed;
  background-repeat: no-repeat;
  background-size: cover;
}

/* 登录遮罩：由「蓝紫实色」换成同款晨光渐变 */
#loginOverlay{
  background:
    radial-gradient(760px 460px at 10% 2%,   rgba(255,255,255,.62), transparent 62%),
    radial-gradient(700px 520px at 94% 90%,  rgba(255,213,232,.42), transparent 64%),
    linear-gradient(165deg,#e8f1ff 0%,#e9e9fd 32%,#f7edf8 58%,#e6f5f2 100%) !important;
}

/* ---------- ② 卡片：玻璃拟态 ---------- */
.app-container{ background: rgba(255,255,255,.46) !important; }

.card,
.modal-card,
.sync-card,
.login-card,
.cloud-sheet-card,
.pr-card,
.perf-header-card,
.cs-item,
.ss-item,
.list-card{
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.card, .modal-card, .sync-card, .cloud-sheet-card, .pr-card, .login-card{
  background: rgba(255,255,255,.80) !important;
  border: 1px solid rgba(255,255,255,.86) !important;
  border-radius: var(--radius-lg) !important;
  box-shadow: var(--shadow) !important;
}
.card:hover{ box-shadow: 0 14px 32px rgba(64,86,122,.16) !important; }
.cs-item{ background: rgba(255,255,255,.72) !important; border: 1px solid rgba(255,255,255,.80) !important; border-radius: var(--radius) !important; }
.ss-item{ background: rgba(255,255,255,.72) !important; border: 1px solid rgba(255,255,255,.80) !important; border-radius: var(--radius) !important; }
.login-card{ box-shadow: 0 20px 54px rgba(52,74,110,.18) !important; }
.modal-mask{ background: rgba(30,45,70,.30) !important; backdrop-filter: blur(3px); }

/* 首页快捷入口：柔和白瓦片 */
.quick-item{
  background: rgba(255,255,255,.62);
  border: 1px solid rgba(255,255,255,.80);
  border-radius: 16px;
  transition: background .15s, transform .15s;
}
.quick-item:hover{ background: rgba(255,255,255,.92); transform: translateY(-2px); }

/* ---------- ③ 按钮：柔和胶囊 + 主色渐变 ---------- */
.btn-primary,
.login-btn,
.todo-add-btn{
  background: linear-gradient(135deg,#6FA0FB,#4A86F7) !important;
  color:#fff !important;
  border:none !important;
  border-radius: 999px !important;
  box-shadow: 0 6px 16px rgba(74,134,247,.28) !important;
}
.btn-primary:active,
.login-btn:active{ transform: scale(.97); }
.login-switch{ border-radius:999px !important; color: var(--primary) !important; }

/* ---------- ③ 分段 / 筛选 / 分类 标签 ---------- */
.subtabs{
  background: rgba(255,255,255,.62) !important;
  border: 1px solid rgba(255,255,255,.80) !important;
}
.filter-tab, .cat-tab{
  background: rgba(255,255,255,.72) !important;
  border: 1px solid rgba(168,192,222,.42) !important;
  border-radius: 999px !important;
  color: var(--text-secondary) !important;
}
.subtab{ background: transparent !important; border: none !important; }
.filter-tab.active, .cat-tab.active, .subtab.active{
  background: linear-gradient(135deg,#6FA0FB,#4A86F7) !important;
  color:#fff !important;
  border-color: transparent !important;
  box-shadow: 0 5px 12px rgba(74,134,247,.26) !important;
}
.login-tabs{ background: rgba(255,255,255,.60) !important; border-radius:999px !important; padding:4px; gap:6px; }
.login-tab{ background: transparent !important; border:none !important; border-radius:999px !important; color: var(--text-secondary) !important; }
.login-tab.active{ background: linear-gradient(135deg,#6FA0FB,#4A86F7) !important; color:#fff !important; }

/* ---------- ④ 分级 / 状态色：保留语义，只换色号 ---------- */
.client-chip.chip-urgent{ background:#FDE8E8 !important; color:#C34A4A !important; border:1px solid #F7D2D2 !important; }
.client-chip.chip-warn  { background:#FEF0DD !important; color:#B26A1E !important; border:1px solid #F6DFC0 !important; }
.client-chip.chip-ok    { background:#E0F6EC !important; color:#1F8F63 !important; border:1px solid #C6EBD8 !important; }
.client-chip.chip-contact{ background:#E3EEFF !important; color:#3A6FD0 !important; border:1px solid #D0E1FC !important; }
.g-lv1{ background:#E0F6EC !important; color:#1F8F63 !important; }
.g-lv2{ background:#E3EEFF !important; color:#3A6FD0 !important; }
.g-lv3{ background:#FEF0DD !important; color:#B26A1E !important; }
.badge.level{ background:#FEF0DD !important; color:#B26A1E !important; }
.badge.level.b5{ background:#E0F6EC !important; color:#1F8F63 !important; }
.badge.wrong{ background:#FDE8E8 !important; color:#C34A4A !important; }
.client-owner-badge{ background:#ECE8FF !important; color:#6A58D6 !important; }
.focus-chip.on{ background: var(--primary-light) !important; border-color: var(--primary) !important; color: var(--primary-dark) !important; font-weight:600; }
/* 形状统一为胶囊（颜色不动） */
.badge, .badge-btn, .tag, .status-tag, .client-tag-mini, .g-lv, .client-chip{ border-radius: 999px !important; }

/* ---------- ③ 输入控件 ---------- */
input, select, textarea, .login-field{
  background: rgba(255,255,255,.88) !important;
  border: 1px solid rgba(168,192,222,.45) !important;
  border-radius: 12px !important;
}
input:focus, select:focus, textarea:focus, .login-field:focus{
  border-color: var(--primary) !important;
  box-shadow: 0 0 0 3px rgba(79,138,248,.15) !important;
}
.ep-avatars .ep-av.active{ background: var(--primary) !important; }

/* ---------- 侧栏 / 底部导航 ---------- */
.sidebar{
  background: rgba(255,255,255,.80) !important;
  border-right: 1px solid rgba(255,255,255,.80) !important;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.sidebar-item.active{ background: linear-gradient(135deg,#6FA0FB,#4A86F7) !important; }
.m-nav-item.active{ color: var(--primary) !important; }

/* ---------- ⑤ 老版里「写死的旧蓝紫」统一换成新主色系 ---------- */
.hero-banner,
.perf-header-card{
  background: linear-gradient(135deg,#5C93FA 0%,#4A86F7 55%,#8F7BF3 100%) !important;
}
.focus-hero{
  background: linear-gradient(135deg,#6FA0FB 0%,#8F7BF3 52%,#F6A04D 100%) !important;
}
.client-avatar{ background: linear-gradient(135deg,#7FA9FB,#8F7BF3) !important; }
.focus-add-btn:hover,
.focus-chip:hover{ border-color: var(--primary) !important; color: var(--primary) !important; }
.rt-sched-toolbar button.primary:hover{ background: var(--primary-dark) !important; }

/* ---------- 滚动条：跟随新色系，弱化存在感 ---------- */
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background: rgba(120,150,190,.35); border-radius:99px; }
::-webkit-scrollbar-track{ background: transparent; }
</style>
</head>
<body>
  <div class="card">
    <div class="spin" id="spin"></div>
    <div class="t">正在为你选择最快入口…</div>
    <div class="s" id="msg">并发探测中</div>
    <div class="links" id="links">
      <div class="s" style="margin-bottom:4px">暂不可达，请手动选择：</div>
    </div>
  </div>
<script>
(function(){
  // v228：双稳定镜像（CloudStudio 临时链接已失效 500，从候选移除，避免拖慢探测）
  // v253：探测目标从根路径(2.2MB index.html)改为 router.html(约5KB)——
  //       旧版为了测速会把两份完整应用各下载一遍再跳转第三遍，导致"打开网页非常慢"。
  var MIRRORS=[
    {name:"GitHub Pages", url:"https://hosmile123.github.io/good/"},
    {name:"Vercel",       url:"https://workbench-ten-psi.vercel.app/"}
  ];
  var TIMEOUT=2500;   // 单镜像探测超时（探测对象只有 5KB，足够）
  var SAFETY=5000;    // 全局安全兜底：超过此时间必定显示手动链接
  var msg=document.getElementById("msg");
  var resolved=false; // 防止重复处理

  // 当前页面若本身就在某镜像上，记下它，避免跳回自己造成循环
  function hereRoot(){
    var h=location.href;
    for(var i=0;i<MIRRORS.length;i++){
      if(h.indexOf(MIRRORS[i].url)===0) return MIRRORS[i].url;
    }
    return null;
  }

  // 记住/读取上次选中的最快镜像（入口页固定在 github.io，localStorage 可用）
  function remember(u){ try{ localStorage.setItem("wb_mirror", u); }catch(e){} }
  function lastGood(){ try{ return localStorage.getItem("wb_mirror")||""; }catch(e){ return ""; } }

  // 显示手动链接兜底
  function showFallback(reason){
    if(resolved) return;
    resolved=true;
    msg.textContent=reason||"暂不可达，请手动选择";
    document.getElementById("spin").style.display="none";
    var box=document.getElementById("links");
    box.classList.add("show");
    MIRRORS.forEach(function(m){
      var a=document.createElement("a");
      a.href=m.url;
      a.innerHTML=m.name+"<small>"+m.url+"</small>";
      box.appendChild(a);
    });
  }

  function go(m, note){
    if(resolved) return;
    resolved=true;
    remember(m.url);
    if(note) msg.textContent=note;
    location.replace(m.url);
  }

  // 探测：仅 HTTP 2xx 视为可达；只抓 5KB 的 router.html，不抓 2.2MB 的应用
  function ping(m){
    return new Promise(function(resolve){
      var start=Date.now();
      var done=false;
      function finish(ok){
        if(done) return;
        done=true;
        resolve({m:m,ok:ok,ms:Date.now()-start});
      }
      var to=setTimeout(function(){finish(false);},TIMEOUT);
      if(typeof fetch === 'undefined'){
        // 老浏览器降级：Image 探测，onload=可达，onerror=不可达
        var img=new Image();
        img.onload=function(){clearTimeout(to);finish(true);};
        img.onerror=function(){clearTimeout(to);finish(false);};
        img.src=m.url+"router.html?_="+Date.now();
        return;
      }
      fetch(m.url+"router.html?_="+Date.now(), {method:'GET', mode:'cors', cache:'no-store'})
        .then(function(r){ clearTimeout(to); finish(r.ok); })
        .catch(function(){ clearTimeout(to); finish(false); });
    });
  }

  // 全局安全兜底：无论探测结果如何，超过 SAFETY 毫秒必定显示手动链接
  setTimeout(function(){showFallback("探测超时，请手动选择");},SAFETY);

  var here=hereRoot();

  // 如果浏览器连 Promise 都不支持，直接显示手动链接
  if(typeof Promise==="undefined"){showFallback("浏览器版本较低，请手动选择");return;}

  // 快速通道：上次用过的镜像若 1.2s 内有响应，立即进入（不等全部探测完）
  var last=lastGood();
  if(last){
    var lm=null;
    MIRRORS.forEach(function(m){ if(m.url===last) lm=m; });
    if(lm && (!here || here!==lm.url)){
      (function(){
        var done=false;
        var to=setTimeout(function(){done=true;},1200);
        fetch(lm.url+"router.html?_="+Date.now(), {cache:'no-store'})
          .then(function(r){ clearTimeout(to); if(!done && r.ok){ done=true; go(lm,"已进入 "+lm.name); } })
          .catch(function(){ clearTimeout(to); done=true; });
      })();
    }
  }

  Promise.all(MIRRORS.map(ping)).then(function(res){
    if(resolved) return;
    var good=res.filter(function(r){return r.ok;});
    if(!good.length){showFallback("镜像暂不可达，请手动选择");return;}
    good.sort(function(a,b){return a.ms-b.ms;});
    var best=good[0];
    if(here && here===best.m.url){
      // 当前已是最快可达镜像：直接进应用根路径（避免循环）
      resolved=true; remember(best.m.url);
      location.replace(best.m.url);
      return;
    }
    setTimeout(function(){go(best,"已选 "+best.m.name+"（"+Math.round(best.ms)+"ms）");},80);
  }).catch(function(){showFallback("探测出错，请手动选择");});
})();
</script>
</body>
</html>
