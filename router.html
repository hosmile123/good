<title>工作台 · 智能入口</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#f5f7fa;color:#1f2d3d}
  .card{width:min(92vw,420px);background:#fff;border-radius:16px;padding:28px 24px;
        box-shadow:0 2px 12px rgba(0,0,0,.06);text-align:center}
  .spin{width:34px;height:34px;margin:0 auto 16px;border:4px solid #d3d1c7;
        border-top-color:#378add;border-radius:50%;
        animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .t{font-size:16px;font-weight:500;margin-bottom:6px}
  .s{font-size:13px;color:#5f5e5a;line-height:1.6}
  .links{margin-top:18px;display:none;flex-direction:column;gap:10px}
  .links.show{display:flex}
  .links a{display:block;text-decoration:none;padding:11px 14px;border-radius:10px;
           background:#e6f1fb;color:#0c447c;font-size:14px;border:1px solid #b5d4f4}
  .links a small{display:block;color:#185fa5;font-size:12px;margin-top:2px}
</style>




















<style id="ax-design">
/* ============================ 1. 设计令牌 ============================ */
:root{
  /* 画布 / 文字 */
  --ax-bg:#F1F5FC;
  --ax-card:#FFFFFF;
  --ax-ink:#16203A;
  --ax-ink-2:#5C6884;
  --ax-ink-3:#93A0BA;
  --ax-line:#EDF1F9;

  /* 主色与功能色 */
  --ax-primary:#6C5CE7;
  --ax-primary-soft:rgba(108,92,231,.10);
  --ax-blue:#3D7BF0;
  --ax-green:#22C55E;
  --ax-orange:#F59E0B;
  --ax-red:#EF4444;
  --ax-teal:#14B8A6;
  --ax-pink:#F76C9E;

  /* 渐变 */
  --ax-g-blue:linear-gradient(135deg,#6AA5FF 0%,#3D7BF0 100%);
  --ax-g-indigo:linear-gradient(135deg,#8B7CF6 0%,#6C5CE7 100%);
  --ax-g-green:linear-gradient(135deg,#5BE08E 0%,#22C55E 100%);
  --ax-g-orange:linear-gradient(135deg,#FBC55F 0%,#F59E0B 100%);
  --ax-g-red:linear-gradient(135deg,#FB7E8E 0%,#EF4444 100%);
  --ax-g-teal:linear-gradient(135deg,#4DD9CE 0%,#14B8A6 100%);
  --ax-g-pink:linear-gradient(135deg,#FCA5C4 0%,#F76C9E 100%);

  /* 形状 */
  --ax-r-lg:20px; --ax-r-md:16px; --ax-r-sm:11px; --ax-r-xs:8px;
  --ax-shadow:0 8px 24px rgba(66,84,140,.07);
  --ax-shadow-sm:0 3px 12px rgba(66,84,140,.05);
  --ax-shadow-hover:0 14px 34px rgba(66,84,140,.13);

  /* 覆盖存量页面常用的旧变量名（尽量让老 CSS 也跟着变色） */
  --primary:#6C5CE7; --primary-color:#6C5CE7;
  --accent:#3D7BF0;
  --bg:#F1F5FC; --background:#F1F5FC;
  --card-bg:#FFFFFF; --surface:#FFFFFF;
  --text:#16203A; --text-color:#16203A;
  --border-color:#EDF1F9;
  --radius:16px; --radius-lg:20px;
  --shadow:0 8px 24px rgba(66,84,140,.07);
}

/* ============================ 2. 画布 ============================ */
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Inter,sans-serif !important;
  color:var(--ax-ink);
  background-color:#EDF3FB !important;
  background-image:
    radial-gradient(46% 40% at 3% 0%,  rgba(122,168,255,.26), transparent 60%),
    radial-gradient(42% 34% at 98% 1%, rgba(150,132,255,.20), transparent 62%),
    radial-gradient(46% 40% at 94% 100%, rgba(94,214,220,.16), transparent 62%),
    linear-gradient(160deg,#EAF2FD 0%,#F3F6FE 46%,#EDF6FB 100%) !important;
  background-attachment:fixed !important;
  background-repeat:no-repeat !important;
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}

/* 可选：整体色相柔化（不改结构，只做统一） */
::selection{ background:rgba(61,123,240,.22); color:var(--ax-ink); }

/* 滚动条 —— 细、圆、低存在感 */
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#CFD9EC,#B9C6E0);
  border-radius:999px; border:2.5px solid transparent; background-clip:content-box;
}
*::-webkit-scrollbar-thumb:hover{ background:#9FB0D0; background-clip:content-box; }
*{ scrollbar-width:thin; scrollbar-color:#C6D2E8 transparent; }

a{ color:inherit; }

/* ============================ 3. 通用元素 ============================ */

/* --- 标题层次 --- */
h1{ font-size:22px; font-weight:800; letter-spacing:.2px; color:var(--ax-ink); }
h2{ font-size:17px; font-weight:800; letter-spacing:.2px; color:var(--ax-ink); }
h3{ font-size:15px; font-weight:750; color:var(--ax-ink); }
h4{ font-size:13.5px; font-weight:700; color:var(--ax-ink-2); }

/* --- 按钮 --- */
button, .btn, input[type=button], input[type=submit], [class*="btn-"]{
  font-family:inherit;
  border-radius:var(--ax-r-sm);
  transition:transform .14s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
}
button:not([class*="icon"]):not([class*="close"]):hover,
.btn:hover{ transform:translateY(-1px); }
button:active, .btn:active{ transform:translateY(0) scale(.985); }
button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid rgba(108,92,231,.55); outline-offset:2px;
}
/* 主按钮：原来的实色蓝/绿/黑，统一成品牌渐变 */
.btn-primary, .btn.main, .primary, button.primary,
button[type=submit].btn:not(.btn-outline):not(.ghost){
  background:var(--ax-g-indigo) !important;
  color:#fff !important;
  border-color:transparent !important;
  box-shadow:0 8px 18px rgba(108,92,231,.30) !important;
}
.btn-primary:hover{ box-shadow:0 12px 24px rgba(108,92,231,.38) !important; }
/* 次按钮：白底描边 */
.btn-outline, .btn.ghost, button.ghost{
  background:#fff !important;
  color:var(--ax-ink-2) !important;
  border:1px solid var(--ax-line) !important;
  box-shadow:var(--ax-shadow-sm) !important;
}

/* --- 表单控件 --- */
input[type=text], input[type=password], input[type=email], input[type=number],
input[type=search], input[type=tel], input[type=url], input[type=date], select, textarea,
.form-control, .form-input{
  border-radius:var(--ax-r-sm) !important;
  border:1px solid var(--ax-line) !important;
  background:#fff !important;
  color:var(--ax-ink) !important;
  font-family:inherit !important;
  transition:border-color .16s, box-shadow .16s;
}
input:focus, select:focus, textarea:focus, .form-control:focus{
  border-color:rgba(108,92,231,.55) !important;
  box-shadow:0 0 0 3.5px rgba(108,92,231,.13) !important;
  outline:none !important;
}
input::placeholder, textarea::placeholder{ color:var(--ax-ink-3) !important; }

/* --- 表格 --- */
table{ border-collapse:collapse; }
thead th, table th{
  font-size:11.5px !important; font-weight:650 !important;
  color:var(--ax-ink-3) !important;
  background:transparent !important;
  border-bottom:1px solid var(--ax-line) !important;
}
td{ font-size:12.5px !important; color:var(--ax-ink-2) !important; border-bottom:1px solid var(--ax-line) !important; }
tbody tr:hover td{ background:#FAFCFF !important; }
tbody tr:last-child td{ border-bottom:0 !important; }

/* ============================ 4. 卡片族 ============================ */
/* 覆盖存量页面里各种卡片命名；只改外观，不改 display/position */
.card, .panel, .pcard, .stat-card, .prod-card, .cat-card, .game-card,
.client-card, .client-bid-card, .cloud-sheet-card, .ps-card,
.login-box, .auth-box, .modal-card, .modal-box, .login-card, .box-card,
[class$="-card"]:not([class*="card-"]):not(.card-icon):not(.card-hd){
  border-radius:var(--ax-r-lg) !important;
  background:var(--ax-card) !important;
  box-shadow:var(--ax-shadow) !important;
  border:1px solid rgba(237,241,249,.9) !important;
}
/* 卡片悬停：轻微抬起（仅对明显可点的卡） */
.game-card:hover, .prod-card:hover, .cat-card:hover, .client-card:hover,
.cloud-sheet-card:hover, [class$="-card"].clickable:hover{
  box-shadow:var(--ax-shadow-hover) !important;
  transform:translateY(-2px);
}

/* 小控件块（快速入口/工具项） */
.quick-item, .wi, .nav-card, .gn-item, .tool-item, .entry-item{
  border-radius:var(--ax-r-md) !important;
  background:#FAFCFF !important;
  border:1px solid var(--ax-line) !important;
  transition:transform .15s, box-shadow .15s, background .15s;
}
.quick-item:hover, .wi:hover, .tool-item:hover, .entry-item:hover{
  transform:translateY(-2px);
  box-shadow:var(--ax-shadow-sm) !important;
  background:#fff !important;
}

/* 顶部品牌横幅（hero）—— 统一成品牌柔彩 */
.hero-banner, .banner, .header-banner{
  border-radius:var(--ax-r-lg) !important;
  background:linear-gradient(135deg,#EEF3FF 0%,#F3F0FF 52%,#EAF7FF 100%) !important;
  border:1px solid rgba(237,241,249,.9) !important;
  box-shadow:var(--ax-shadow-sm) !important;
}

/* ============================ 5. 标签 / 徽章 ============================ */
.pill, .tag, .badge, .chip, .level-badge, .client-tag-badge, .member-tag,
[class$="-tag"]:not(.tag-row), [class$="-badge"]{
  border-radius:999px !important;
  font-weight:650 !important;
  border:0 !important;
}
/* 状态色统一（按常见语义命名兜底） */
.pill.ok, .pill.done-ok, .badge.ok, .tag.ok, .done, [class*="status-ok"]{
  background:#E4F8EC !important; color:#16A34A !important;
}
.pill.wait, .pill.pending, .badge.wait, .tag.warn, .badge.normal{
  background:#FEF3D9 !important; color:#B45309 !important;
}
.pill.done, .badge.info, .tag.info{
  background:#E3EEFF !important; color:#2563EB !important;
}
.badge.urgent, .tag.danger, [class*="status-err"]{
  background:#FEE9E9 !important; color:#DC2626 !important;
}

/* ============================ 6. 弹窗 / 遮罩 ============================ */
.modal-mask, .mask, .overlay, .dialog-mask, .gm-mask, .sync-mask, [class$="-overlay"]{
  background:rgba(22,32,58,.34) !important;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.modal-card, .modal-box, .dialog, [class$="-modal"]:not(.modal-mask){
  border-radius:var(--ax-r-lg) !important;
  box-shadow:0 24px 60px rgba(30,44,90,.24) !important;
  border:1px solid rgba(237,241,249,.9) !important;
}

/* ============================ 7. 侧栏 / 导航 ============================ */
.sidebar, .side, aside[class], [class$="-sidebar"]{
  border-radius:var(--ax-r-lg);
}
.sidebar-item, .nav-item, .side-item, .menu-item{
  border-radius:var(--ax-r-sm) !important;
  transition:background .16s, color .16s;
}
.sidebar-item:hover, .nav-item:hover, .side-item:hover{
  background:#F5F8FD !important;
  color:var(--ax-ink) !important;
}
/* 选中态：品牌渐变胶囊 */
.sidebar-item.active, .nav-item.active, .side-item.active, .menu-item.active,
.sidebar-item.on, .nav-item.on{
  background:var(--ax-g-indigo) !important;
  color:#fff !important;
  box-shadow:0 8px 18px rgba(108,92,231,.30) !important;
}
.sidebar-item.active svg, .nav-item.active svg, .side-item.active svg{ opacity:1; }

/* 顶栏 / 工具条 */
.topbar, .toolbar, .toolbar-inner, .user-bar, .top{
  border-radius:var(--ax-r-md);
}

/* 分段控件 */
.seg, .tabs, .subtabs, .lib-tab, [class$="-tabs"]{
  background:#F3F6FD !important;
  border-radius:999px !important;
  padding:3px !important;
}
.seg > *, .tabs > *, .subtabs > *, .lib-tab{
  border-radius:999px !important;
  font-weight:600;
}
.seg > .on, .seg > .active, .tabs > .on, .tabs > .active,
.subtabs > .on, .subtabs > .active, .lib-tab.on, .lib-tab.active{
  background:#fff !important;
  color:var(--ax-blue) !important;
  box-shadow:var(--ax-shadow-sm) !important;
}

/* 表格里的进度条 / 通用进度条 */
.track, [class$="-track"]{
  background:#EDF1F9 !important;
  border-radius:999px !important;
  overflow:hidden;
}
.fill, [class$="-fill"], .progress > i{
  border-radius:999px !important;
  background:var(--ax-g-indigo);
}

/* ============================ 8. 新增：数据看板模块 ============================ */
/* 该模块由 aurora-dash.js 生成，命名统一 ax- 前缀，不与页面样式冲突 */

.ax-dash{ display:flex; flex-direction:column; gap:14px; margin:0 0 16px; }

/* 问候顶栏 */
.ax-hero{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  border-radius:var(--ax-r-lg); padding:18px 22px;
  background:linear-gradient(135deg,#EFEFFF 0%,#EAF1FF 48%,#E9F7FF 100%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--ax-shadow-sm);
  position:relative; overflow:hidden;
}
.ax-hero::after{
  content:""; position:absolute; right:-40px; top:-60px; width:190px; height:190px;
  border-radius:50%; background:radial-gradient(circle,rgba(140,124,246,.22),transparent 70%);
}
.ax-hero .ax-hi{ font-size:20px; font-weight:800; letter-spacing:.2px; position:relative; z-index:1; }
.ax-hero .ax-sub{ font-size:12.5px; color:var(--ax-ink-2); margin-top:4px; position:relative; z-index:1; }
.ax-hero .ax-hero-r{ margin-left:auto; display:flex; gap:9px; align-items:center; position:relative; z-index:1; flex-wrap:wrap; }
.ax-hero .ax-chip{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:650;
  background:rgba(255,255,255,.86); border:1px solid rgba(255,255,255,.9);
  padding:7px 13px; border-radius:999px; color:var(--ax-ink-2); box-shadow:var(--ax-shadow-sm);
}
.ax-hero .ax-chip b{ color:var(--ax-primary); }

/* KPI 卡 */
.ax-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:13px; }
.ax-kpi{
  border-radius:var(--ax-r-md); padding:15px 16px 14px; position:relative; overflow:hidden;
  border:1px solid rgba(255,255,255,.85); box-shadow:var(--ax-shadow-sm);
  background:linear-gradient(150deg,#EEF5FF,#E3EDFF);
}
.ax-kpi::after{
  content:""; position:absolute; right:-26px; top:-30px; width:86px; height:86px;
  border-radius:50%; background:rgba(255,255,255,.42);
}
.ax-kpi .ax-ic{
  position:absolute; right:13px; top:13px; width:28px; height:28px; border-radius:9px;
  display:grid; place-items:center; z-index:2;
  box-shadow:0 3px 0 rgba(20,34,70,.10), 0 7px 14px rgba(30,44,90,.14);
}
.ax-kpi .ax-ic svg{ position:relative; z-index:1; }
.ax-kpi .ax-v{ font-size:23px; font-weight:800; letter-spacing:.2px; position:relative; z-index:1; line-height:1.25; }
.ax-kpi .ax-v em{ font-size:12px; font-style:normal; font-weight:700; color:var(--ax-ink-2); margin-left:2px; }
.ax-kpi .ax-l{ font-size:11.5px; color:var(--ax-ink-2); margin-top:3px; position:relative; z-index:1; }
.ax-kpi .ax-t{ font-size:11px; font-weight:700; margin-top:7px; position:relative; z-index:1; }
.ax-kpi .ax-t.up{ color:#16A34A; } .ax-kpi .ax-t.down{ color:#DC2626; } .ax-kpi .ax-t.flat{ color:var(--ax-ink-3); }
.ax-kpi.c-blue{ background:linear-gradient(150deg,#EEF5FF,#E3EDFF); }
.ax-kpi.c-indigo{ background:linear-gradient(150deg,#F2EFFF,#E9E4FF); }
.ax-kpi.c-green{ background:linear-gradient(150deg,#EDFBF2,#E1F8EA); }
.ax-kpi.c-orange{ background:linear-gradient(150deg,#FFF7E9,#FDEED4); }
.ax-kpi.c-pink{ background:linear-gradient(150deg,#FFF0F5,#FDE6EE); }
.ax-kpi.c-teal{ background:linear-gradient(150deg,#EAFBF9,#DDF6F3); }

/* 分栏容器 */
.ax-cols{ display:grid; gap:14px; }
.ax-cols.c2{ grid-template-columns:1fr 1fr; }
.ax-cols.c21{ grid-template-columns:1.6fr 1fr; }
.ax-cols.c12{ grid-template-columns:1fr 1.6fr; }
.ax-cols.c1{ grid-template-columns:1fr; }
.ax-note{ padding:14px 18px; }
.ax-note .ax-empty{ padding:0; text-align:left; }

/* 通用卡 */
.ax-card{
  background:#fff; border-radius:var(--ax-r-lg); box-shadow:var(--ax-shadow);
  padding:16px 18px; border:1px solid rgba(237,241,249,.9);
}
.ax-h{ display:flex; align-items:center; gap:9px; margin-bottom:11px; }
.ax-h .ax-bar{ width:3px; height:14px; border-radius:2px; background:var(--ax-g-blue); flex:0 0 3px; }
.ax-h h3{ margin:0; font-size:14.5px; font-weight:800; letter-spacing:.2px; }
.ax-h .ax-r{ margin-left:auto; font-size:11.5px; color:var(--ax-ink-3); display:flex; align-items:center; gap:6px; }

/* 工具宫格（复用页面既有功能，点击即触发原有处理）。
   用 auto-fill 而非 auto-fit：工具项少时保持图标尺寸，不被拉伸变形。 */
.ax-tools{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:11px; }
.ax-tool{
  background:#FAFCFF; border:1px solid var(--ax-line); border-radius:var(--ax-r-md);
  padding:13px 8px 11px; text-align:center; cursor:pointer;
  transition:transform .15s, box-shadow .15s, background .15s, border-color .15s;
}
.ax-tool:hover{ transform:translateY(-2px); box-shadow:var(--ax-shadow-sm); background:#fff; border-color:#E2E9F6; }
.ax-tool .ax-ti{
  width:40px; height:40px; border-radius:13px; margin:0 auto 9px;
  display:grid; place-items:center; color:#fff; position:relative;
  box-shadow:0 3px 0 rgba(20,34,70,.13), 0 7px 14px rgba(30,44,90,.15);
}
.ax-tool .ax-ti::before{
  content:""; position:absolute; inset:0; border-radius:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 56%);
}
.ax-tool .ax-ti svg{ position:relative; z-index:1; }
.ax-tool .ax-tn{ font-size:11.5px; color:var(--ax-ink-2); line-height:1.35; }
.ax-ti.gb{ background:var(--ax-g-blue); } .ax-ti.gi{ background:var(--ax-g-indigo); }
.ax-ti.gg{ background:var(--ax-g-green); } .ax-ti.go{ background:var(--ax-g-orange); }
.ax-ti.gr{ background:var(--ax-g-red); } .ax-ti.gt{ background:var(--ax-g-teal); }
.ax-ti.gp{ background:var(--ax-g-pink); }

/* 条形排行 */
.ax-bars{ display:flex; flex-direction:column; gap:13px; }
.ax-bar-row .ax-bh{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; color:var(--ax-ink-2); }
.ax-bar-row .ax-bh b{ color:var(--ax-ink); font-weight:750; }
.ax-bar-track{ height:8px; border-radius:999px; background:#EDF1F9; overflow:hidden; }
.ax-bar-fill{ height:100%; border-radius:999px; background:var(--ax-g-indigo); transition:width .5s ease; }

/* 环形图 */
.ax-donut{ display:flex; align-items:center; gap:20px; }
.ax-donut-legend{ display:flex; flex-direction:column; gap:11px; font-size:12.5px; flex:1; }
.ax-donut-legend .it{ display:flex; align-items:center; gap:8px; color:var(--ax-ink-2); }
.ax-donut-legend .it i{ width:9px; height:9px; border-radius:3px; flex:0 0 9px; }
.ax-donut-legend .it b{ margin-left:auto; color:var(--ax-ink); }

/* 折线/面积图 */
.ax-chart{ width:100%; display:block; overflow:visible; }
.ax-legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; font-size:12px; color:var(--ax-ink-2); }
.ax-legend i{ width:8px; height:8px; border-radius:3px; display:inline-block; margin-right:6px; }

/* 任务/进度卡 */
.ax-tasks{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }

  }

  function findHost() {
    var cands = ['.main', 'main', '#main', '.content', '#content', '.container',
      '.app', '#app', '.app-main', '.layout', '.wrap', '.page', '#page'];
    for (var i = 0; i < cands.length; i++) {
      var n = document.querySelector(cands[i]);
      if (usableHost(n) && n.offsetHeight > 120) return n;
    }
    // 兜底 1：body 下「够大」且不是遮罩/不能装子节点的直接子元素
    var kids = document.body.children, best = null, first = null;
    for (var j = 0; j < kids.length; j++) {
      var k = kids[j];
      if (!usableHost(k)) continue;
      if (k.id === 'ax-dash-root') continue;
      if (!first) first = k;
      if (!best && k.offsetHeight > 240) best = k;
    }
    if (best) return best;
    if (first) return first;      // 兜底 2：没有"够大"的，就用第一个可用的子元素
    return document.body;
  }

  /* ------------------------------ 自动发现"常用功能" ------------------------------ */
  function discoverTools() {
    var out = [], used = {};
    /* 先按「确定的导航类名」取；取不够再用通用兜底扫可点元素。
       CFG.tools 可由页面配置追加优先选择器（该页专用，不影响其它页）。 */
    var sels = (CFG.tools || []).concat(['.sidebar-item', '.nav-item', '.side-item', '.menu-item', '.quick-item', '.wi', '.tool-item',
      '.lib-tab', '.subtab', '.admin-tab', '.subtabs > *', '.tab', '.seg > *', 'nav a', '.toolbar button']);
    function push(n) {
      if (!n || (n.closest && n.closest('#ax-dash-root'))) return;
      if (n.closest && n.closest('.modal-mask,.gm-mask,.sync-mask,[class$="-overlay"]')) return;
      var txt = (n.textContent || '').replace(/\s+/g, ' ').trim();
      if (!txt || txt.length > 12) return;
      if (/^[\d\s.·\-—+%()（）]+$/.test(txt)) return;      // 纯数字/符号跳过
      if (used[txt]) return;
      used[txt] = 1;
      out.push({ node: n, label: txt });
    }
    for (var i = 0; i < sels.length && out.length < 8; i++) {
      var nodes = document.querySelectorAll(sels[i]);
      for (var j = 0; j < nodes.length && out.length < 8; j++) push(nodes[j]);
    }
    if (out.length < 4) {
      /* 兜底：可见的按钮 / 链接 / 带 onclick 的短文本元素 */
      var gen = document.querySelectorAll('button, a, [role="button"], [onclick]');
      for (var k = 0; k < gen.length && out.length < 8; k++) {
        var e = gen[k];
        if (e.type === 'hidden') continue;
        if (e.offsetParent === null && e.offsetWidth === 0) continue;   // 不可见
        push(e);
      }
    }
    return out;
  }

  /* ------------------------------ 构建看板 ------------------------------ */
  function build() {
    var root = el('div', 'ax-dash');
    root.id = 'ax-dash-root';

    /* --- ① 问候顶栏 --- */
    var now = new Date();
    var hh = now.getHours();
    var hi = hh < 6 ? '夜深了' : hh < 11 ? '早上好' : hh < 13 ? '中午好' : hh < 18 ? '下午好' : '晚上好';
    var name = CFG.user || '';
    try { name = name || localStorage.getItem('ax_user') || localStorage.getItem('wb_user') || ''; } catch (e) {}
    if (name && name.length > 8) name = '';
    var wd = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][now.getDay()];
    var hero = el('div', 'ax-hero');
    hero.appendChild(el('div', '', '<div class="ax-hi">' + hi + (name ? '，' + esc(name) : '') + ' 👋</div>' +
      '<div class="ax-sub">' + esc(CFG.greet || (CFG.project ? CFG.project + ' · 今日概览' : '今日概览')) +
      ' · ' + now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + wd + '</div>'));
    var hr = el('div', 'ax-hero-r');
    (CFG.heroChips || []).forEach(function (c) {
      hr.appendChild(el('span', 'ax-chip', esc(c.t) + (c.b != null ? ' <b>' + esc(c.b) + '</b>' : '')));
    });
    hr.appendChild(el('span', 'ax-chip ax-fold', '<span class="ax-arrow">▾</span> 收起看板'));
    hero.appendChild(hr);
    root.appendChild(hero);

    var body = el('div', 'ax-dash-body');
    root.appendChild(body);

    /* --- ② KPI --- */
    var kpis = CFG.kpis || [];
    if (kpis.length) {
      var kg = el('div', 'ax-kpis');
      var shown = 0;
      kpis.forEach(function (k) {
        var r = resolve(k);
        /* 宁可少一张卡，也不显示会误导人的 0 / 假数字 */
        var zeroish = (r.n === 0 || r.n == null || r.n === '');
        if (zeroish && k.hideIfEmpty !== false) return;
        shown++;
        var shownVal = (r.raw != null && r.raw !== '') ? esc(r.raw) : (r.real ? num(r.n) : '—');
        var tail = (r.raw != null && r.raw !== '') ? '' : (k.unit ? '<em>' + esc(k.unit) + '</em>' : '');
        var card = el('div', 'ax-kpi c-' + (k.color || 'blue'));
        card.innerHTML =
          '<span class="ax-ic" style="background:var(--ax-g-' + (k.color || 'blue') + ')">' + svg(k.icon || 'star') + '</span>' +
          '<div class="ax-v">' + shownVal + tail + '</div>' +
          '<div class="ax-l">' + esc(k.label) + '</div>' +
          (k.trend ? '<div class="ax-t ' + (k.trendDir || 'flat') + '">' + esc(k.trend) + '</div>' : '');
        kg.appendChild(card);
      });
      if (shown) {
        body.appendChild(kg);
      } else {
        /* 全部无值时不留空洞：给一条克制的提示（登录/接入数据后自动出现） */
        body.appendChild(el('div', 'ax-card ax-note',
          '<div class="ax-empty">业务数据将在登录后自动汇总到这里</div>'));
      }
    }

    /* --- ③ 图表 + 洞察 行 --- */
    if (CFG.chart || CFG.insight) {
      var both = !!(CFG.chart && CFG.insight);
      var cols = el('div', 'ax-cols ' + (both ? 'c21' : 'c1'));
      if (CFG.chart) {
        var c1 = el('div', 'ax-card');
        c1.appendChild(el('div', 'ax-h', '<span class="ax-bar"></span><h3>' + esc(CFG.chart.title || '趋势') + '</h3>' +
          '<span class="ax-r">' + esc(CFG.chart.note || '近 12 期') + '</span>'));
        c1.appendChild(el('div', '', areaChart(CFG.chart.points || [4, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16], CFG.chart.color || '#6C5CE7')));
        if (CFG.chart.legend) {
          c1.appendChild(el('div', 'ax-legend', CFG.chart.legend.map(function (l) {
            return '<span><i style="background:' + l.c + '"></i>' + esc(l.n) + '</span>';
          }).join('')));
        }
        cols.appendChild(c1);
      }
      if (CFG.insight) {
        var c2 = el('div', 'ax-card');
        c2.appendChild(el('div', 'ax-h', '<span class="ax-bar"></span><h3>' + esc(CFG.insight.title || '结构洞察') + '</h3>'));
        if (CFG.insight.donut) {
          c2.appendChild(el('div', '', donut(CFG.insight.donut)));
        } else {
          /* barsFrom：运行时实时计数（真实数据）；bars：静态数值 */
          var items = CFG.insight.barsFrom
            ? CFG.insight.barsFrom.map(function (b) {
                var v = b.sel ? document.querySelectorAll(b.sel).length : (b.textOf && toNum((document.querySelector(b.textOf) || {}).textContent)) || 0;
                return { n: b.n, v: v || 0, c: b.c };
              }).filter(function (b) { return b.v > 0; })
            : (CFG.insight.bars || []);
          if (items.length) {
            var maxv = Math.max.apply(null, items.map(function (b) { return b.v; })) || 1;
            c2.appendChild(el('div', 'ax-bars', items.map(function (b) {
              return '<div class="ax-bar-row"><div class="ax-bh"><span>' + esc(b.n) + '</span><b>' + esc(b.v) + '</b></div>' +
                '<div class="ax-bar-track"><div class="ax-bar-fill" style="width:' + (b.v / maxv * 100).toFixed(1) +
                '%;background:' + (b.c || 'var(--ax-g-indigo)') + '"></div></div></div>';
            }).join('')));
          } else {
            c2.appendChild(el('div', 'ax-empty', '暂无可统计的记录'));
          }
        }
        cols.appendChild(c2);
      }
      body.appendChild(cols);
    }

    /* --- ④ 常用功能宫格（复用既有元素与其点击处理） --- */
    var tools = discoverTools();
    if (tools.length) {
      var tc = el('div', 'ax-card');
      tc.appendChild(el('div', 'ax-h', '<span class="ax-bar"></span><h3>常用功能</h3>' +
        '<span class="ax-r">点击直达 · 与原菜单同一入口</span>'));
      var grid = el('div', 'ax-tools');
      var pal = ['gb', 'gi', 'gg', 'go', 'gt', 'gr', 'gp'];
      tools.forEach(function (t, i) {
        var d = el('div', 'ax-tool');
        d.innerHTML = '<div class="ax-ti ' + pal[i % pal.length] + '">' + svgInk('bolt') + '</div>' +
          '<div class="ax-tn">' + esc(t.label) + '</div>';
        d.title = '等同于点击「' + t.label + '」';
        d.addEventListener('click', function () {
          try {
            t.node.scrollIntoView({ behavior: 'smooth', block: 'center' });
            t.node.click();
          } catch (e) {}
        });
        grid.appendChild(d);
      });
      tc.appendChild(grid);
      body.appendChild(tc);
    }

    /* --- ⑤ 折叠 --- */
    var fold = root.querySelector('.ax-fold');
    if (fold) {
      fold.addEventListener('click', function () {
        var hidden = body.classList.toggle('hidden');
        var ar = fold.querySelector('.ax-arrow');
        if (ar) ar.textContent = hidden ? '▸' : '▾';
        var t = fold.childNodes[fold.childNodes.length - 1];
        if (t && t.nodeType === 3) t.textContent = hidden ? ' 展开看板' : ' 收起看板';
      });
    }
    return root;
  }

  /* ------------------------------ 挂载 ------------------------------ */
  function mount() {
    try {
      if (document.getElementById('ax-dash-root')) return;   // 幂等
      var dash = build();
      /* 选项卡式布局（如 AI 外呼：页面由多个互斥 .wrap 标签页组成）：
         塞进任何一个 wrap 都会随标签切换而消失。CFG.after 指定锚点选择器时，
         把看板插到锚点「之后、同一层级」，使其常驻在标签内容之上。 */
      if (CFG.after) {
        var anchor = document.querySelector(CFG.after);
        if (anchor && anchor.parentNode) {
          anchor.parentNode.insertBefore(dash, anchor.nextSibling);
          dash.style.maxWidth = '1180px';
          dash.style.margin = '16px auto 16px';
          dash.style.padding = '0 24px';
          if (CFG.afterPad === false) dash.style.padding = '0';
          return;
        }
      }
      var host = findHost();
      if (!host) return;
      host.insertBefore(dash, host.firstChild);
      // 让看板随内容滚动，不遮挡既有吸顶元素
      dash.style.marginBottom = '16px';
    } catch (e) {
      if (window.console) console.warn('[aurora-dash] 挂载失败（已忽略，不影响原页面）：', e);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(mount, 60); });
  else setTimeout(mount, 60);

  // 页面是 SPA 时，视图切换后补挂一次
  window.addEventListener('hashchange', function () { setTimeout(mount, 260); });
  window.__axMount = mount;
})();
</script>
</head>
<body>
  <div class="card">
    <div class="spin" id="spin"></div>
    <div class="t">正在为你选择最快入口…</div>
    <div class="s" id="msg">并发探测中</div>
    <div class="links" id="links">
      <div class="s" style="margin-bottom:4px">暂不可达，请手动选择：</div>
    </div>
  </div>
<script>
(function(){
  // v228：双稳定镜像（CloudStudio 临时链接已失效 500，从候选移除，避免拖慢探测）
  // v253：探测目标从根路径(2.2MB index.html)改为 router.html(约5KB)——
  //       旧版为了测速会把两份完整应用各下载一遍再跳转第三遍，导致"打开网页非常慢"。
  var MIRRORS=[
    {name:"GitHub Pages", url:"https://hosmile123.github.io/good/"},
    {name:"Vercel",       url:"https://workbench-ten-psi.vercel.app/"}
  ];
  var TIMEOUT=2500;   // 单镜像探测超时（探测对象只有 5KB，足够）
  var SAFETY=5000;    // 全局安全兜底：超过此时间必定显示手动链接
  var msg=document.getElementById("msg");
  var resolved=false; // 防止重复处理

  // 当前页面若本身就在某镜像上，记下它，避免跳回自己造成循环
  function hereRoot(){
    var h=location.href;
    for(var i=0;i<MIRRORS.length;i++){
      if(h.indexOf(MIRRORS[i].url)===0) return MIRRORS[i].url;
    }
    return null;
  }

  // 记住/读取上次选中的最快镜像（入口页固定在 github.io，localStorage 可用）
  function remember(u){ try{ localStorage.setItem("wb_mirror", u); }catch(e){} }
  function lastGood(){ try{ return localStorage.getItem("wb_mirror")||""; }catch(e){ return ""; } }

  // 显示手动链接兜底
  function showFallback(reason){
    if(resolved) return;
    resolved=true;
    msg.textContent=reason||"暂不可达，请手动选择";
    document.getElementById("spin").style.display="none";
    var box=document.getElementById("links");
    box.classList.add("show");
    MIRRORS.forEach(function(m){
      var a=document.createElement("a");
      a.href=m.url;
      a.innerHTML=m.name+"<small>"+m.url+"</small>";
      box.appendChild(a);
    });
  }

  function go(m, note){
    if(resolved) return;
    resolved=true;
    remember(m.url);
    if(note) msg.textContent=note;
    location.replace(m.url);
  }

  // 探测：仅 HTTP 2xx 视为可达；只抓 5KB 的 router.html，不抓 2.2MB 的应用
  function ping(m){
    return new Promise(function(resolve){
      var start=Date.now();
      var done=false;
      function finish(ok){
        if(done) return;
        done=true;
        resolve({m:m,ok:ok,ms:Date.now()-start});
      }
      var to=setTimeout(function(){finish(false);},TIMEOUT);
      if(typeof fetch === 'undefined'){
        // 老浏览器降级：Image 探测，onload=可达，onerror=不可达
        var img=new Image();
        img.onload=function(){clearTimeout(to);finish(true);};
        img.onerror=function(){clearTimeout(to);finish(false);};
        img.src=m.url+"router.html?_="+Date.now();
        return;
      }
      fetch(m.url+"router.html?_="+Date.now(), {method:'GET', mode:'cors', cache:'no-store'})
        .then(function(r){ clearTimeout(to); finish(r.ok); })
        .catch(function(){ clearTimeout(to); finish(false); });
    });
  }

  // 全局安全兜底：无论探测结果如何，超过 SAFETY 毫秒必定显示手动链接
  setTimeout(function(){showFallback("探测超时，请手动选择");},SAFETY);

  var here=hereRoot();

  // 如果浏览器连 Promise 都不支持，直接显示手动链接
  if(typeof Promise==="undefined"){showFallback("浏览器版本较低，请手动选择");return;}

  // 快速通道：上次用过的镜像若 1.2s 内有响应，立即进入（不等全部探测完）
  var last=lastGood();
  if(last){
    var lm=null;
    MIRRORS.forEach(function(m){ if(m.url===last) lm=m; });
    if(lm && (!here || here!==lm.url)){
      (function(){
        var done=false;
        var to=setTimeout(function(){done=true;},1200);
        fetch(lm.url+"router.html?_="+Date.now(), {cache:'no-store'})
          .then(function(r){ clearTimeout(to); if(!done && r.ok){ done=true; go(lm,"已进入 "+lm.name); } })
          .catch(function(){ clearTimeout(to); done=true; });
      })();
    }
  }

  Promise.all(MIRRORS.map(ping)).then(function(res){
    if(resolved) return;
    var good=res.filter(function(r){return r.ok;});
    if(!good.length){showFallback("镜像暂不可达，请手动选择");return;}
    good.sort(function(a,b){return a.ms-b.ms;});
    var best=good[0];
    if(here && here===best.m.url){
      // 当前已是最快可达镜像：直接进应用根路径（避免循环）
      resolved=true; remember(best.m.url);
      location.replace(best.m.url);
      return;
    }
    setTimeout(function(){go(best,"已选 "+best.m.name+"（"+Math.round(best.ms)+"ms）");},80);
  }).catch(function(){showFallback("探测出错，请手动选择");});
})();
</script>
</body>
